name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # her gün gece yarısı (UTC) otomatik çalışır
  workflow_dispatch: {}    # Actions sekmesinden manuel de tetiklenebilir
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: phylake1
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=white&color_dots=#0D1117,#0e4429,#006d32,#26a641,#39FF14&color_background=#0D1117

      - name: Push output to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
